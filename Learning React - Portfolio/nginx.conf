server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sirve archivos reales tal cual (landings, imágenes, assets del build).
  # Solo si NINGÚN archivo/carpeta coincide, cae al index.html del SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache largo para assets versionados por Vite (tienen hash en el nombre)
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
